class:middle
### Poisson distribution
The Poisson distribution gives the probability mass function (discrete) of all possible numbers of new cases, from 0 to `\(\infty\)`.     
&lt;br&gt;  
--

For a Poisson random variable, the  **variance = mean = E(Y) = `\(\lambda\)`**     
&lt;br&gt;  
where	 `\(\lambda\)` = expected number of cases in a given time period  

--

&lt;br&gt;   
If `\(Y_i\)` = # of new cases with `\(\lambda\)` and `$$Y_i \sim  Poisson (\lambda)$$` then the probability mass function that `\(Y=k\)` (a particular count) is: 
`$$P(Y=k) = \dfrac{\lambda^{k}e^{-\lambda}}{k!}$$`



---
class:middle
## Poisson distribution 
A special case of the binomial:
- with trials  `\(n \to\infty\)` and `\(P\)`(success in any trial) `\(\to 0\)`   
- If `\(p\)` is small, binomial P(k successes) `\(\approx\)` Poisson, P(k with `\(\lambda = np\)`)     
&lt;br&gt;

--

**Example:** 

Consider binomial distribution with probability = 0.01. What is the probability of 8 occurrences in 1000 tries?

.pull-left[
**.red[Binomial]**

``` r
# binomial
dbinom(8,1000,0.01)
```

```
## [1] 0.1128241
```
]
--

**.blue[Poisson]**

``` r
# poisson
dpois(8,1000*.01) # lambda = n*p 
```

```
## [1] 0.112599
```

class:middle

&lt;img src="L16_Poisson_26_files/figure-html/unnamed-chunk-5-1.svg" alt="" width="80%" style="display: block; margin: auto;" /&gt;

- As λ increases Poisson distribution approximates to a .red[normal distribution].
- When _n_ is large and _p_ is very small, Poisson distribution approximates the .blue[binomial distribution].

class:middle

### Poisson Generalized linear models
Framework for statistical analysis (linear &amp; logistic  regression special cases) that involve:         
1. A vector of .red[outcome] data y = (y1,..., yn)    
2. A matrix of .blue[predictors] `\(X\)` and vector of coefficients `\(β\)`, forming a linear predictor vector `\(X β\)`     
3. A .purple[link function] `\(g\)`, yielding a vector of transformed data `\(\hat{y}\)` = `\(g^{−1}(X β)\)`  
4. Possibly other parameters, such as variances, overdispersions, and cutpoints, involved in the  predictors, link function, and data distribution   

--
&lt;br&gt;

Poisson regression model is **NOT** the same as taking the `\(log (Y)\)` and then performing linear regression     
- In a Poisson regression, the left-hand side is `\(E[log(Y|x)]\)`, not the log of the expectation. Poisson model `\(≠\)` log transformed linear model.
 
&lt;span style="color:blue"&gt; `$$E[log(Y)|x] ≠  log(E[Y|x])$$` &lt;/span&gt; 


 
---
class:middle
##Poisson distribution

**What's the advantage of working with** `\(log(E[Y|X])\)` **when dealing with counts?**

--

&lt;br&gt;
If the log of the expected count `\(log(E[Y|X])\)` is modeled, .red[no danger of negative predicted counts] 

- The antilog of any negative regression values correspond to expected counts between 0 and 1   


``` r
exp(-.001)
```

```
## [1] 0.9990005
```

``` r
round(exp(-10)); #exp(-10); 
```

```
## [1] 0
```
--

.pull-right[**... and this is also useful for predicting probabilities!**]

class:middle

## Poisson Generalized Linear Models
A GLM with a log link and a Poisson distribution:
- Used to model count variables 

- Assumes that the **conditional means equal the conditional variances**.  

- A natural model for .red[rates] in data sets with person time (e.g: Mortality). 

- .brown[Under predicts] zero counts and .purple[over predicts] the first set of counts

- Assumes _same rate of outcome among the individual observations_ but incorporating “observed heterogeneity” relax this assumption.

### Poisson Model with Offset
Can't model only the number of outcomes as the exposure time varies. Need to model rates **(outcome/person-time)**. 

So, instead of typical:
`$$\log \mu_x = \beta_0 + \beta_1 x$$`
(where `\(\mu_x\)` is the expected count for those with covariate x), you need:

`$$\log \tfrac{\mu_x}{t_x} = \beta'_0 + \beta'_1 x$$`

(where `\(t_x\)` is the exposure time for those with covariate x). Can be rewritten:

`$$\log \mu_x = \log t_x + \beta'_0 + \beta'_1 x$$`

where `\(\log t_x\)` = the offset (denominator of the rate)

---
class: middle

.pull-right[
**OFFSET:** The parameter representing the size, exposure or measurement time, or population size of each observational unit.
- Including the offset allow varying size, exposure or measurement time, or population size for the observations. 
]
--

- Models without the offset assume everyone has the same duration of exposure or that the denominator is same for everyone constrained to 1. 

- Adding an offset allows estimation of rates allowing for varying exposure or person-time.

### Poisson Model: Assumptions 
 
- (1) That the outcome is a count with no negative values; 

- (2) Independence of observations (the occurrence of one event does not affect the probability of another); 

- (3) a linear relationship between predictors and outcome (log of the expected count), and 

- (4) equi-dispersion or homoscedasticity, where **variance = mean = E(Y) = `\(\lambda\)`**; 

- (5) constant rates



---

class:middle
### Poisson and Negative Binomial models 

- The usual link function `\(g\)` used is the logarithmic, so that `\(g(u) = exp(u)\)` transforms a continuous linear predictor `\(X_i\beta\)`  to a positive `\(\hat{y}\)` (rate ratio)   

- The simplest regression model for count data is `$$y_i \sim Poisson(e^{X_i \beta})$$` 

--

The linear predictor `\(X_i\beta\)` is the logarithm of the expected value of measurement `\(y_i\)`, where `\(sd(y_i) = \sqrt{E(y_i)}\)`   

- When `\(variance \neq mean\)`, we can use the **negative binomial distribution**: including an extra parameter to capture overdispersion, that is, variation in the data beyond what would be predicted from the Poisson distribution alone. .red[More of this in 705]

### Which Poisson model is preferred - analytical methods

For regular maximum likelihood models:

- **Akaike  information criterion (AIC)**, which can be extracted from the associated `glm` model, is often used to compare models with .red[smaller values representing a better fit]      

*AIC = deviance + 2k*, where k = number of  coefficients and deviance = −2 times the log score  (`logLik(model)`)    

--

``` r
cbind(Model= c("Risk", "Rate-Poisson", "Rate-Neg.Binomial (1)",  "Rate-Neg.Binomial (2)"), 
    AIC= c(round(pois1$aic, 2), round(pois2$aic, 2), round(pois2a$aic, 2), round(pois2b$aic, 2)))
```

.small[
**.black[Background:]** In 2023 an out-of-hospital cardiac arrest (OHCA) registry was established in Penang, Malaysia. Objective: To facilitate systematic, sustainable collection and analysis of OHCA cases across the state. Authors describe the data collection processes and presents a descriptive analysis of first-year data, from April 2023 to March 2024 (n=5087).

In total, 16.3% had a resuscitation attempt by EMS. Most individuals were of either Chinese (52.2%) or Malay (33.0%) ethnicity; most OHCA occurred at home (92.8%). The median ambulance response time was 21 min [IQR 16-29]. Among EMS-attempted resuscitation cases, 47.2% were witnessed by laypersons, bystander CPR was provided in 43.5%, and an AED was applied in  7.1% and the 30-day survival was 1.3%.

## Poisson Model
- Poisson models to get the RISK ratio this way produces biased confidence intervals
- The model assumes a Poisson distribution when in fact the outcomes are binary.  
- To overcome issues with the variance, we could use a variance estimator that is robust to the misspecification of the model. 

**Why and When do we use Poisson?**
+ Used for rare outcomes 
+ When the follow-up has different lengths 

---
class:middle
### Why and When do we use Poisson?
- For common outcomes, Poisson regression is likely to compute conservative CIs, suggesting less precision than is true. 

- Poisson regression produces wider CIs (compared with a log-binomial model and stratified analysis) because Poisson errors are overestimates of binomial errors when the outcome is common 

- Poisson errors approximately equal binomial errors when the outcome is rare

class:middle
### .blue[Robust] Poisson Models
The Poisson regression uses a logarithm as the natural link function under the GLM framework. 

- The robust Poisson regression model uses the **classical sandwich estimator** under the .red[generalized estimation equation (GEE)] framework to correct the inflated variance (also known as over-dispersion) in the standard Poisson regression. 

- The technique is known as .blue[modified Poisson regression or pseudo-likelihood estimation].

- This correction can be achieved by using the REPEATED statement in SAS Proc GENMOD or the ROBUST option in STATA’s Poisson procedure, or `quasipoisson` family and/or `robust` option in `R`.

class:middle
### Robust Poisson models vs.  Log-Binomial
In presence of linear confounders, the two models yield comparable relative biases

- With the non-linear confounders, the robust Poisson model outperform the log-binomial model. 
 + Larger differences with rare outcomes
 
- The robust Poisson models are more robust to outliers compared to the log-binomial models when estimating relative risks or risk ratios for common binary outcomes.

---
class:middle
###Log-Binomial vs Robust Poisson?
**Recall:** Software utilizes iterative weighted least squares (IWLS*) approach or variations of IWLS to find MLEs for generalized linear models. 

- For log-binomial models, the weights used by the IWLS approach contain the term `\(1/(1-p)\)`, where `\(p = exp(XTβ)\)` with a range from 0 to 1. 

- The MLE of a log-binomial model is likely to be **too sensitive to outliers** because a very large `\(p\)` has a large influence on the weights.

- MLE and pseudolikelihood estimators are deteriorated in presence of outliers. 

.red[The level of deterioration differed when the relationships between the confounder and the outcome was not in a simple form.]

---
class:middle
###Log-Binomial vs Robust Poisson?

- The log-binomial method is generally preferred due to the fact that the MLEs estimated by the log-binomial models are more efficient compared to the pseudo-likelihood estimators used by the robust Poisson models.

- .red[Spiegelman and Hertzmark recommend using the log-binomial models over the robust Poisson models when convergence is not an issue.]

- It appears that the gain in efficiency is beneficial to log-binomial models only for samples of small sizes.

--

.purple[Due to the concern of lack of efficiency for the robust Poisson models for small samples, log-binomial may still be the choice when the sample size is small.]

- Can use `loo_compare()` in `rstanarm` package to compare models by `loo`, an approximate .red[leave-one-out cross-validation] shortcut [Gelman A, ROS page 174](https://avehtari.github.io/ROS-Examples/index.html)  


``` r
loo_compare(loo(pois6),loo(pois8))
```

```
#&gt;  model elpd_diff se_diff p_worse diag_diff diag_elpd

```

- Other option is the **Widely Applicable Information Criterion (AIC)** using `waic(modelname)`

``` r
cbind(Model=c("Poisson", "Neg. Binomial"), WAIC=c(round(waic(pois6)$waic,2), round(waic(pois8)$waic,2)))
```

### Maximum likelihood estimate of lambda 
`$$MLE = \ell(\lambda; y_1, \dots, y_n) = \sum_{i = 1}^n \log f(y_i; \lambda) = \sum_{i = 1}^n \log \frac{\lambda^{y_1}exp^{-\lambda}}{y_1!}$$`

Take first derivative (notation `\(\prime = \frac{d(.)}{d\lambda}\)`)        

`\(\ell^\prime(\lambda; y_1, \dots, y_n) =  \sum_{i = 1}^n \log \frac{\lambda^{y_1}exp^{-\lambda}}{y_1!}^\prime\)`

`\(= \sum_{i = 1}^n \left\{ -\lambda + y_i \cdot \log(\lambda) - \log(y_i!) \right\}^\prime\)`

`\(= \sum_{i = 1}^n \left\{ -1 + y_i \cdot \frac{1}{\lambda} \right\}\)`

`\(= -n + \frac{1}{\lambda} \sum_{i = 1}^n y_i\)`    
                                      

---

class: middle
### Maximum likelihood estimate of lambda 

The first-order condition for maximizing the log-likelihood sets its derivative to zero

`$$\ell^\prime(\lambda; y_1, \dots, y_n)  = 0$$`
`$$-n + \frac{1}{\lambda} \sum_{i = 1}^n y_i = 0$$`
`$$n \cdot \lambda  = \sum_{i = 1}^n y_i$$`
`$$\lambda = \frac{1}{n} \sum_{i = 1}^n y_i = \bar y$$`
  
Thus, the maximum likelihood estimator is simply the empirical mean `\(\hat \lambda = \bar y\)`
